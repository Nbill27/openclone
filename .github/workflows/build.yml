name: Build and Release

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      # Base64 of the release keystore. When the secret is absent (forks,
      # pull requests) the job falls back to a debug build so CI still works.
      KEYSTORE_B64: ${{ secrets.OPENCLONE_KEYSTORE_BASE64 }}
      OPENCLONE_KEYSTORE_PASSWORD: ${{ secrets.OPENCLONE_KEYSTORE_PASSWORD }}
      OPENCLONE_KEY_ALIAS: ${{ secrets.OPENCLONE_KEY_ALIAS }}
      OPENCLONE_KEY_PASSWORD: ${{ secrets.OPENCLONE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Pin the components this project needs. Do not rely on the default
          # package list: it used to include "tools", which Google removed from
          # the SDK repository and which broke older action versions.
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon

      - name: Decode release keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/openclone-release.jks"
          echo "OPENCLONE_KEYSTORE=$RUNNER_TEMP/openclone-release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          if [ -n "$OPENCLONE_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            echo "::warning::No release keystore configured, building a debug APK."
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenClone-apk
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: OpenClone-apk
          path: dist

      - name: Create release and attach APK
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*.apk
          generate_release_notes: true
